<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="researchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B45"/>
      <stop offset="100%" stop-color="#0a1928"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="600" fill="url(#researchBg)"/>
  <rect width="800" height="600" fill="url(#grid2)"/>
  
  <!-- Subtle scientific circles -->
  <circle cx="400" cy="240" r="140" fill="#1b3654" opacity="0.4"/>
  <circle cx="400" cy="240" r="100" fill="none" stroke="rgba(220,234,245,0.15)" stroke-dasharray="6 6"/>
  <circle cx="400" cy="240" r="170" fill="none" stroke="rgba(220,234,245,0.08)"/>

  <!-- Microscope / Flask / Atom synthesis -->
  <g transform="translate(400, 230)">
    <!-- Atom orbits -->
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#64B5F6" stroke-width="2.5" opacity="0.7" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#E6A15C" stroke-width="2.5" opacity="0.7" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#DCEAF5" stroke-width="2.5" opacity="0.7" transform="rotate(90)"/>
    <circle cx="0" cy="0" r="14" fill="#E6A15C"/>
    
    <!-- Electrons -->
    <circle cx="75" cy="40" r="6" fill="#64B5F6"/>
    <circle cx="-65" cy="50" r="6" fill="#E6A15C"/>
    <circle cx="0" cy="-88" r="6" fill="#DCEAF5"/>
  </g>

  <!-- Tag -->
  <rect x="240" y="390" width="320" height="42" rx="21" fill="rgba(100, 181, 246, 0.12)" stroke="#64B5F6" stroke-width="1.5"/>
  <text x="400" y="417" font-family="'Poppins', sans-serif" font-size="15" font-weight="600" fill="#64B5F6" text-anchor="middle" letter-spacing="1.5">
    RESEARCH &amp; ACADEMIC EXPOSURE
  </text>
  
  <text x="400" y="475" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="#F8F7F3" text-anchor="middle">
    Research Internship at IIT Indore
  </text>
  <text x="400" y="512" font-family="'Poppins', sans-serif" font-size="16" fill="#DCEAF5" text-anchor="middle">
    Exploring Science Beyond Textbooks &amp; Standard Examinations
  </text>
</svg>
